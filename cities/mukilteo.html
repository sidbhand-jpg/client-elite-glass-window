<script>
document.addEventListener('DOMContentLoaded', () => {
  // Read slug from URL: /your-city.html -> your-city
  const slug = window.location.pathname.split('/').pop().replace('.html', '');
  const area = CONFIG.serviceAreas.find(a => a.slug === slug);

  if (!area) {
    document.getElementById('city-hero').innerHTML = `
      <div class="container-wide" style="padding-top:8rem;padding-bottom:4rem;text-align:center;color:#fff">
        <h1 style="font-family:var(--font-display);font-size:2rem;font-weight:700">Location Not Found</h1>
        <p style="margin-top:1rem;color:rgba(255,255,255,0.8)">
          We may still serve your area!
          <a href="/contact.html" style="color:var(--color-primary);text-decoration:underline">Contact us</a> to find out.
        </p>
      </div>`;
    return;
  }

  const countyStr = area.county ? `, ${area.county} County` : '';

  // Meta
  document.title = `Glass & Window Services in ${area.name}, ${CONFIG.stateShort} | ${CONFIG.businessName}`;
  document.querySelector('meta[name="description"]').setAttribute('content',
    `${CONFIG.businessName} provides window replacement, shower doors, custom glass, mirrors, railings, doors, and commercial glass in ${area.name}, ${CONFIG.stateShort}.`
  );

  // Hero
  document.getElementById('city-eyebrow').textContent = `${CONFIG.businessName} · ${area.name}, ${CONFIG.stateShort}`;
  document.getElementById('city-headline').innerHTML = `Glass & Window Services in <span style="color:var(--color-primary)">${area.name}</span>`;
  document.getElementById('city-sub').innerHTML = `Custom-measured glass, windows, doors, showers, mirrors, railings, and commercial solutions for ${area.name} homes and businesses.`;
  document.querySelector('.city-rating').style.display = 'none';

  // Service pills
  document.getElementById('city-service-pills').innerHTML = CONFIG.services.map(s => `
    <a href="../services/${s.slug}.html" class="city-service-pill">${s.name}</a>`).join('');

  // Lead form
  buildLeadForm('city-lead-form', { variant: 'card', showCity: true, showMessage: false });

  // Why us section
  document.getElementById('city-why-header').innerHTML = sectionHeaderHTML({
    eyebrow: area.name,
    title: `Why ${area.name} Homeowners & Businesses Choose ${CONFIG.businessName}`
  });
  const whyPoints = [
    `Redmond-based team serving ${area.name}`,
    "Residential and commercial glass expertise",
    "Clear estimates and practical recommendations",
    "Custom measurement and product guidance",
    "Professional installation and final walkthrough",
  ];
  document.getElementById('city-why-grid').innerHTML = whyPoints.map(item => `
    <div class="city-why-item">
      <svg class="why-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>${item}</span>
    </div>`).join('');

  // Map
  document.getElementById('city-map-header').innerHTML = sectionHeaderHTML({
    eyebrow: 'Service Area',
    title: `We Come to You in ${area.name}`,
    subtitle: "Contact us to confirm availability for your address and project type."
  });
  document.getElementById('city-map').innerHTML = mapEmbedHTML(`${area.name} ${CONFIG.stateShort} home services contractor`);

  // FAQs
  const cityFaqs = [
    {
      q: `Do you provide glass and window services in ${area.name}?`,
      a: `Yes. ${area.name} is within our listed Greater Seattle service area. Availability depends on the project type, address, and schedule.`,
    },
    {
      q: `Which services are available in ${area.name}?`,
      a: `We provide window and glass replacement, shower doors, entry and patio doors, glass railings, mirrors, storefront glass, and custom fabricated glass.`,
    },
    {
      q: `Can I visit the showroom before a ${area.name} project?`,
      a: `Yes. Our showroom is at ${CONFIG.address}. Contact the team before visiting to confirm current hours and relevant product samples.`,
    },
    {
      q: `How do I request an estimate in ${area.name}?`,
      a: `Share the address, product or glass type, approximate dimensions, photos, and any timeline constraints. Final custom fabrication requires verified measurements.`,
    },
  ];

  document.getElementById('city-faq-header').innerHTML = sectionHeaderHTML({
    eyebrow: `${area.name} FAQ`,
    title: `Glass & Window Questions from ${area.name} Customers`
  });
  renderFAQs('city-faq-container', cityFaqs);

  // CTA
  document.getElementById('city-cta').innerHTML = ctaSectionHTML({
    title: `Planning a Glass Project in ${area.name}?`,
    subtitle: `Request a free consultation from ${CONFIG.businessName} for product guidance, measurement, and a clear written scope.`
  });
});
</script>
