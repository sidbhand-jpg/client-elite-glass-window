<script>
false && document.addEventListener('DOMContentLoaded', () => {
  document.title = `Our Work | Portfolio | ${CONFIG.businessName}`;

  // Build unique category list
  const cats = [...new Set(PROJECTS.map(p => p.category))];

  // Filter buttons
  document.getElementById('filter-btns').innerHTML = cats.map(c => `
    <button class="filter-btn" data-filter="${c}">${c}</button>`).join('');

  // Render portfolio grid
  function renderGrid(filter) {
    const projects = filter === 'all'
      ? PROJECTS
      : PROJECTS.filter(p => p.category === filter);

    document.getElementById('portfolio-grid').innerHTML = projects.map((p, i) => `
      <div class="portfolio-item" data-category="${p.category}">
        <button class="portfolio-img-btn" data-img="${p.img}" data-title="${p.title}" data-cat="${p.category}" aria-label="Open ${p.title}">
          <img src="${p.img}" alt="${p.alt}" width="${p.width}" height="${p.height}" class="portfolio-img" loading="${i < 6 ? 'eager' : 'lazy'}" />
          <div class="portfolio-overlay">
            <div class="portfolio-overlay-inner">
              <div class="portfolio-cat-badge">${p.category}</div>
              <div class="portfolio-project-title">${p.title}</div>
            </div>
          </div>
        </button>
      </div>`).join('');

    // Attach lightbox listeners to new buttons
    document.querySelectorAll('.portfolio-img-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        openLightbox(btn.dataset.img, btn.dataset.title, btn.dataset.cat);
      });
    });
  }

  renderGrid('all');

  // JSON-LD: ItemList of ImageObject, sourced from PROJECTS
  const portfolioJsonLd = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": PROJECTS.map((p, i) => ({
      "@type": "ListItem",
      "position": i + 1,
      "item": {
        "@type": "ImageObject",
        "contentUrl": p.img,
        "name": p.title,
        "description": p.alt,
        "width": p.width,
        "height": p.height
      }
    }))
  };
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(portfolioJsonLd);
  document.head.appendChild(ldScript);

  // Filter click handling
  document.querySelector('.portfolio-filter-inner').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-btn-active'));
    btn.classList.add('filter-btn-active');
    renderGrid(btn.dataset.filter);
  });

  // Lightbox
  function openLightbox(src, title, cat) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-img').alt = title;
    document.getElementById('lightbox-caption').textContent = `${title} — ${cat}`;
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

  // Reviews strip
  document.getElementById('portfolio-proof-header').innerHTML = sectionHeaderHTML({
    eyebrow: 'What Customers Say',
    title: 'Real Reviews from Real Projects'
  });
  document.getElementById('portfolio-reviews-row').innerHTML = CONFIG.testimonials.slice(0, 3).map(t => `
    <div class="portfolio-review-card">
      <div class="stars">${renderStars(t.stars)}</div>
      <p class="portfolio-review-text">"${t.text}"</p>
      <div class="portfolio-review-name">${t.name} · ${t.location}</div>
    </div>`).join('');

  // CTA
  document.getElementById('portfolio-cta').innerHTML = ctaSectionHTML({
    title: "Want a Project Like These?",
    subtitle: "Free site visit and written quote. Most installs completed in one day."
  });
});

document.addEventListener('DOMContentLoaded', () => {
  document.title = `Our Work | Portfolio | ${CONFIG.businessName}`;
  const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  })[char]);
  const absoluteImageUrl = (src) => src.startsWith('http') ? src : `${CONFIG.siteUrl}${src}`;
  const cats = [...new Set(PROJECTS.map(project => project.category))];

  document.getElementById('filter-btns').innerHTML = cats.map(category => `
    <button class="filter-btn" data-filter="${escapeHTML(category)}">${escapeHTML(category)}</button>`).join('');

  function imageButton(image, caption, className, loading = 'lazy') {
    return `
      <button type="button" class="project-image-button ${className}" data-img="${escapeHTML(image.img)}" data-caption="${escapeHTML(caption)}" aria-label="Open image: ${escapeHTML(caption)}">
        <img src="${escapeHTML(image.img)}" alt="${escapeHTML(image.alt)}" width="${image.width}" height="${image.height}" loading="${loading}" />
        <span class="project-image-label">${escapeHTML(caption)}</span>
      </button>`;
  }

  function checklist(items) {
    return `<ul class="project-checklist">${items.map(item => `<li>${escapeHTML(item)}</li>`).join('')}</ul>`;
  }

  function renderProject(project, index) {
    return `
      <article class="project-case-study" id="${escapeHTML(project.id)}" data-category="${escapeHTML(project.category)}">
        <div class="project-summary-grid">
          ${imageButton(project, `${project.title} - project overview`, 'project-cover', index < 2 ? 'eager' : 'lazy')}
          <div class="project-intro">
            <span class="portfolio-cat-badge">${escapeHTML(project.category)}</span>
            <h2>${escapeHTML(project.title)}</h2>
            <p class="project-tagline">${escapeHTML(project.tagline)}</p>
            <div class="project-meta" aria-label="Project information">
              <span>${escapeHTML(project.location)}</span>
              <span>${escapeHTML(project.completed)}</span>
              <span>${escapeHTML(project.duration)}</span>
            </div>
            <p class="project-summary">${escapeHTML(project.summary)}</p>
          </div>
          <details class="project-disclosure">
              <summary>View full case study and all photos</summary>
              <div class="project-expanded">
                <section class="project-overview">
                  <p class="project-section-label">Project Overview</p>
                  <p>${escapeHTML(project.overview)}</p>
                </section>
                <section>
                  <p class="project-section-label">Before, During &amp; After</p>
                  <div class="project-process-grid">
                    ${project.process.map(image => imageButton(image, image.stage, 'project-process-image')).join('')}
                  </div>
                </section>
                <div class="project-info-grid">
                  <section class="project-info-card">
                    <h3>${escapeHTML(project.benefitHeading)}</h3>
                    ${checklist(project.benefits)}
                  </section>
                  <section class="project-info-card">
                    <h3>Product Details</h3>
                    <dl class="project-detail-list">
                      ${project.details.map(detail => `<div><dt>${escapeHTML(detail.label)}</dt><dd>${escapeHTML(detail.value)}</dd></div>`).join('')}
                    </dl>
                  </section>
                  <section class="project-info-card">
                    <h3>Project Features</h3>
                    ${checklist(project.features)}
                  </section>
                </div>
                <section>
                  <p class="project-section-label">More ${escapeHTML(project.category)} Work</p>
                  <div class="project-related-grid">
                    ${project.related.map(image => imageButton(image, image.title, 'project-related-image')).join('')}
                  </div>
                </section>
              </div>
          </details>
        </div>
      </article>`;
  }

  function renderGrid(filter) {
    const projects = filter === 'all' ? PROJECTS : PROJECTS.filter(project => project.category === filter);
    document.getElementById('portfolio-grid').innerHTML = projects.map(renderProject).join('');
  }
  renderGrid('all');

  const portfolioJsonLd = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": PROJECTS.map((project, index) => ({
      "@type": "ListItem",
      "position": index + 1,
      "item": {
        "@type": "CreativeWork",
        "url": `${CONFIG.siteUrl}/our-work.html#${project.id}`,
        "name": project.title,
        "description": project.summary,
        "dateCreated": project.completed,
        "locationCreated": { "@type": "Place", "name": project.location },
        "image": [project, ...project.process, ...project.related].map(image => absoluteImageUrl(image.img))
      }
    }))
  };
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(portfolioJsonLd);
  document.head.appendChild(ldScript);

  document.querySelector('.portfolio-filter-inner').addEventListener('click', (event) => {
    const button = event.target.closest('.filter-btn');
    if (!button) return;
    document.querySelectorAll('.filter-btn').forEach(item => item.classList.remove('filter-btn-active'));
    button.classList.add('filter-btn-active');
    renderGrid(button.dataset.filter);
  });

  function openLightbox(src, caption) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-img').alt = caption;
    document.getElementById('lightbox-caption').textContent = caption;
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }
  document.getElementById('portfolio-grid').addEventListener('click', (event) => {
    const button = event.target.closest('.project-image-button');
    if (button) openLightbox(button.dataset.img, button.dataset.caption);
  });
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeLightbox(); });

  const linkedProject = window.location.hash && document.querySelector(window.location.hash);
  if (linkedProject) {
    linkedProject.querySelector('details').open = true;
    window.setTimeout(() => linkedProject.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }

  document.getElementById('portfolio-proof-header').innerHTML = sectionHeaderHTML({
    eyebrow: 'What Customers Say',
    title: 'Real Reviews from Real Projects'
  });
  document.getElementById('portfolio-reviews-row').innerHTML = CONFIG.testimonials.slice(0, 3).map(testimonial => `
    <div class="portfolio-review-card">
      <div class="stars">${renderStars(testimonial.stars)}</div>
      <p class="portfolio-review-text">"${testimonial.text}"</p>
      <div class="portfolio-review-name">${testimonial.name} &middot; ${testimonial.location}</div>
    </div>`).join('');

  document.getElementById('portfolio-cta').innerHTML = ctaSectionHTML({
    title: "Want a Project Like These?",
    subtitle: "Tell us what you're planning and get a written quote for your space."
  });
});
</script>

<style>
/* ── PORTFOLIO PAGE STYLES ──────────────────────────────── */
/* Note: .portfolio-grid, .portfolio-item, .portfolio-img-btn,
   .portfolio-img, .portfolio-overlay*, .portfolio-cat-badge, and
   .portfolio-project-title now live in styles.css (shared) so the
   home page "Recent Work" section can reuse them. */
.portfolio-filter-bar {
  border-bottom: 1px solid var(--color-slate-200);
}
.portfolio-filter-inner {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding-block: 1rem;
}
#filter-btns { display: contents; }
.filter-btn {
  padding: 0.5rem 1.25rem;
  border-radius: 9999px;
  border: 1.5px solid var(--color-slate-200);
  background: #fff;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--color-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
@media (max-width: 639px) {
  .portfolio-filter-inner {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.5rem;
  }
  .filter-btn {
    width: 100%;
    padding-inline: 0.75rem;
    text-align: center;
  }
}
.filter-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
.filter-btn-active {
  background-color: var(--color-secondary);
  border-color: var(--color-secondary);
  color: #fff;
}
.filter-btn-active:hover { color: #fff; }

.project-list {
  display: grid;
  gap: 2rem;
}
.project-case-study {
  scroll-margin-top: 7rem;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--color-slate-200);
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-md);
}
.project-summary-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
  align-items: stretch;
}
.project-intro {
  padding: clamp(1.5rem, 3vw, 2.5rem);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
}
.project-intro h2 {
  margin: 0.8rem 0 0.45rem;
  font-size: clamp(1.6rem, 3vw, 2.35rem);
  line-height: 1.12;
}
.project-tagline {
  color: var(--color-primary);
  font-weight: 700;
  margin: 0 0 1rem;
}
.project-summary {
  color: var(--color-muted);
  line-height: 1.7;
  margin: 1rem 0 0;
}
.project-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.project-meta span {
  padding: 0.4rem 0.7rem;
  border-radius: 9999px;
  background: var(--color-slate-50);
  border: 1px solid var(--color-slate-200);
  color: var(--color-navy);
  font-size: 0.78rem;
  font-weight: 650;
}
.project-image-button {
  position: relative;
  display: block;
  width: 100%;
  overflow: hidden;
  padding: 0;
  border: 0;
  background: var(--color-secondary);
  color: #fff;
  cursor: zoom-in;
  text-align: left;
}
.project-image-button img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.35s ease;
}
.project-image-button:hover img,
.project-image-button:focus-visible img { transform: scale(1.035); }
.project-image-button:focus-visible { outline: 3px solid var(--color-primary); outline-offset: -3px; }
.project-cover { min-height: 28rem; }
.project-cover img { min-height: 28rem; }
.project-image-label {
  position: absolute;
  inset: auto 0 0;
  padding: 1rem;
  background: linear-gradient(transparent, rgba(5, 14, 28, 0.88));
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.35;
}
.project-disclosure {
  grid-column: 1 / -1;
  border-top: 1px solid var(--color-slate-200);
}
.project-disclosure > summary {
  list-style: none;
  padding: 1.1rem 1.5rem;
  color: var(--color-primary);
  font-weight: 750;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s;
}
.project-disclosure > summary::-webkit-details-marker { display: none; }
.project-disclosure > summary::after { content: ' +'; }
.project-disclosure[open] > summary::after { content: ' -'; }
.project-disclosure > summary:hover { background: var(--color-slate-50); }
.project-expanded {
  display: grid;
  gap: 2rem;
  padding: clamp(1.25rem, 3vw, 2.5rem);
  border-top: 1px solid var(--color-slate-200);
}
.project-section-label {
  margin: 0 0 0.8rem;
  color: var(--color-primary);
  font-size: 0.77rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.project-overview {
  max-width: 60rem;
  color: var(--color-navy);
  font-size: 1.02rem;
  line-height: 1.75;
}
.project-overview p:last-child { margin: 0; }
.project-process-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}
.project-process-image {
  aspect-ratio: 4 / 3;
  border-radius: var(--radius-xl);
}
.project-info-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}
.project-info-card {
  padding: 1.25rem;
  border: 1px solid var(--color-slate-200);
  border-radius: var(--radius-xl);
  background: var(--color-slate-50);
}
.project-info-card h3 {
  margin: 0 0 1rem;
  font-size: 1rem;
  line-height: 1.35;
}
.project-checklist {
  display: grid;
  gap: 0.65rem;
  margin: 0;
  padding: 0;
  list-style: none;
  color: var(--color-muted);
  font-size: 0.88rem;
  line-height: 1.45;
}
.project-checklist li { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem; }

.lightbox {

  max-width: 90vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;

.lightbox-close {

.lightbox-img {
